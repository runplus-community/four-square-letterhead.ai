name: Validate FSL v1.5 spec

on:
  push:
    branches: [spec-v1.5]
  workflow_dispatch:

jobs:
  validate-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec-v1.5
      - name: Validate constitutional contract
        run: |
          set -euo pipefail
          test -f spec/FSL-v1.5-CONSTITUTION.md
          grep -q 'FSL owns the method. The project owns the work.' spec/FSL-v1.5-CONSTITUTION.md
          grep -q 'I-001: tiny' spec/FSL-v1.5-CONSTITUTION.md
          grep -q 'no full future-iteration plan, YAML schema or iteration ledger is required' spec/FSL-v1.5-CONSTITUTION.md
          grep -q 'ITEM | INTENT / USE | CANONICAL SOURCE' spec/FSL-v1.5-CONSTITUTION.md
          grep -q 'SPEC and MEMORY MUST remain fixed lanes' spec/FSL-v1.5-CONSTITUTION.md
          grep -q 'LAW-DEV-001 through LAW-DEV-004 are retired' spec/FSL-v1.5-CONSTITUTION.md
