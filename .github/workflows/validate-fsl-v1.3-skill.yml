name: Validate FSL v1.3 skill

on:
  push:
    branches: [skill-v1.3]
  workflow_dispatch:

jobs:
  validate-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: skill-v1.3
      - name: Validate generation skill and checklist
        run: |
          set -euo pipefail
          test -f skills/FSL-v1.3-SKILL.md
          test -f skills/FSL-v1.3-CHECKLIST.md
          grep -q 'FORM-SCOPE-NNN' skills/FSL-v1.3-SKILL.md
          grep -q 'CLAIM / SCOPE / ENVIRONMENT / EVIDENCE / RESULT' skills/FSL-v1.3-SKILL.md
          grep -q 'Four-Square Template v1.3' skills/FSL-v1.3-SKILL.md
          grep -q 'MEMORY may remember law; MEMORY cannot make law' skills/FSL-v1.3-SKILL.md
          grep -q 'MUST NOT silently choose the stronger or weaker interpretation' skills/FSL-v1.3-SKILL.md
          grep -q 'Do not exceed three pages' skills/FSL-v1.3-SKILL.md
          grep -q 'Accepted release snapshot records branch + commit for all four lanes' skills/FSL-v1.3-CHECKLIST.md
