name: Build and verify FSL v1.8 templates
on:
  push:
    branches: [templates-v1.8]
    paths: ['templates/v1.8/source/**', '.github/workflows/build-fsl-v1.8-templates.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fsl-v1.8-templates
  cancel-in-progress: false
jobs:
  build-templates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: b28a616ae7292913c9f7e3c10095e73c74b9019b
          path: .method-source
          sparse-checkout: skills/FSL-v1.8-SKILL.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer fonts-liberation
          python -m pip install -r templates/v1.8/source/requirements.txt
      - name: Build from the exact English source
        run: |
          set -euo pipefail
          git diff --exit-code fcc1e6f0d17b1e06d34c587ab5a8d3c0402ae910 -- templates/v1.7
          python templates/v1.8/source/build.py --method .method-source/skills/FSL-v1.8-SKILL.md --output templates/v1.8
      - name: Render and verify every document
        run: |
          set -euo pipefail
          for f in templates/v1.8/FSL-v1.8-*.docx; do
            libreoffice -env:UserInstallation=file:///tmp/fsl18-lo --headless --convert-to pdf --outdir templates/v1.8 "$f"
          done
          python -B templates/v1.8/source/verify.py templates/v1.8 --method .method-source/skills/FSL-v1.8-SKILL.md --selftest
          (cd templates/v1.8 && sha256sum FSL-v1.8-*.docx FSL-v1.8-*.pdf > DOCUMENT-SHA256SUMS.txt)
      - name: Commit checked outputs without moving prior releases
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/templates-v1.8 | cut -f1)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/v1.8/FSL-v1.8-*.docx templates/v1.8/FSL-v1.8-*.pdf templates/v1.8/DOCUMENT-SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m 'templates: verified v1.8 lean documents [skip ci]'
            git push origin HEAD:templates-v1.8
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fsl-v1.8-templates
          path: |
            templates/v1.8/FSL-v1.8-*.docx
            templates/v1.8/FSL-v1.8-*.pdf
            templates/v1.8/DOCUMENT-SHA256SUMS.txt
          if-no-files-found: error
