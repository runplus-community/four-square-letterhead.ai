name: Build FSL v1.3 branch release

on:
  push:
    branches: [release/fsl-v1.3]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch release
        uses: actions/checkout@v4
        with:
          ref: release/fsl-v1.3

      - name: Install verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils zip
          python -m pip install --disable-pip-version-check python-docx

      - name: Assemble canonical FSL v1.3 file set
        run: |
          set -euo pipefail
          rm -rf release/v1.3
          mkdir -p release/v1.3
          cp spec/FSL-v1.3-CONSTITUTION.md release/v1.3/
          cp spec/FSL-v1.3-MANIFEST.yaml release/v1.3/
          cp spec/FSL-v1.3-TRACEABILITY.md release/v1.3/
          cp spec/FSL-v1.3-SNAPSHOT.example.yaml release/v1.3/
          cp skills/FSL-v1.3-SKILL.md release/v1.3/
          cp skills/FSL-v1.3-CHECKLIST.md release/v1.3/
          cp memory/FSL-v1.3-MEMORY.md release/v1.3/
          cp templates/v1.3/FSL-v1.3-Template-1P.docx release/v1.3/
          cp templates/v1.3/FSL-v1.3-Template-1P.pdf release/v1.3/
          cp templates/v1.3/FSL-v1.3-Template-2P.docx release/v1.3/
          cp templates/v1.3/FSL-v1.3-Template-2P.pdf release/v1.3/
          cp templates/v1.3/FSL-v1.3-Template-3P.docx release/v1.3/
          cp templates/v1.3/FSL-v1.3-Template-3P.pdf release/v1.3/
          cp templates/v1.3/FSL-v1.3-Sample-Django-2P.docx release/v1.3/
          cp templates/v1.3/FSL-v1.3-Sample-Django-2P.pdf release/v1.3/
          cp RELEASES/FSL-v1.3.md release/v1.3/RELEASE-NOTES-FSL-v1.3.md
          cp VERSION release/v1.3/VERSION

          cat > release/v1.3/FSL-v1.3-SNAPSHOT.yaml <<'EOF'
          fsl: "1.3"
          project: "four-square-letterhead.ai"
          project_version: "1.3"
          branches:
            spec:
              branch: "spec-v1.3"
              commit: "2bab14c1087a1f43776bc060dc5f20f5f8170e50"
            lane_a:
              branch: "templates-v1.3"
              commit: "4ed6025d4b9dacd45b8aed1f0c46dfc131ce8e0f"
            lane_b:
              branch: "skill-v1.3"
              commit: "fce5533d76a0d00e18c6191800eb1d6410a67a17"
            memory:
              branch: "memory-v1.3"
              commit: "ff9bcac350ec2abf14723baac34c7652a4c7c1be"
          authority: "git"
          integration:
            branch: "main"
            commit: "7888188df64e653f707decf499b7642dabb90c66"
          EOF

      - name: Verify document and constitutional contract
        run: |
          set -euo pipefail
          test "$(pdfinfo release/v1.3/FSL-v1.3-Template-1P.pdf | awk '/^Pages:/ {print $2}')" = 1
          test "$(pdfinfo release/v1.3/FSL-v1.3-Template-2P.pdf | awk '/^Pages:/ {print $2}')" = 2
          test "$(pdfinfo release/v1.3/FSL-v1.3-Template-3P.pdf | awk '/^Pages:/ {print $2}')" = 3
          test "$(pdfinfo release/v1.3/FSL-v1.3-Sample-Django-2P.pdf | awk '/^Pages:/ {print $2}')" = 2
          grep -q 'LAW-TRACE-001' release/v1.3/FSL-v1.3-CONSTITUTION.md
          grep -q 'LAW-VERSION-001' release/v1.3/FSL-v1.3-CONSTITUTION.md
          grep -q 'LAW-SNAPSHOT-001' release/v1.3/FSL-v1.3-CONSTITUTION.md
          grep -q 'LAW-AI-001' release/v1.3/FSL-v1.3-CONSTITUTION.md
          grep -q 'MEMORY may remember law; MEMORY cannot make law' release/v1.3/FSL-v1.3-MEMORY.md
          grep -q '7888188df64e653f707decf499b7642dabb90c66' release/v1.3/FSL-v1.3-SNAPSHOT.yaml
          grep -q '4ed6025d4b9dacd45b8aed1f0c46dfc131ce8e0f' release/v1.3/FSL-v1.3-SNAPSHOT.yaml
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          root=Path('release/v1.3')
          docs=list(root.glob('FSL-v1.3-*.docx'))
          assert len(docs)==4, docs
          for p in docs:
              d=Document(p)
              text=[]; emphasized=0
              for s in d.sections:
                  for tbl in list(s.header.tables)+list(s.footer.tables):
                      for row in tbl.rows:
                          for cell in row.cells: text.append(cell.text)
              for para in d.paragraphs:
                  text.append(para.text)
                  for r in para.runs:
                      if r.bold and r.underline and any(k in r.text for k in ('MUST','SHOULD','MAY','CONFORMANT','EXCEPTION')):
                          emphasized += 1
              for tbl in d.tables:
                  for row in tbl.rows:
                      for cell in row.cells:
                          text.append(cell.text)
                          for para in cell.paragraphs:
                              for r in para.runs:
                                  if r.bold and r.underline and any(k in r.text for k in ('MUST','SHOULD','MAY','CONFORMANT','EXCEPTION')):
                                      emphasized += 1
              joined='\n'.join(text)
              assert 'Four-Square Template v1.3' in joined, p
              assert emphasized >= 5, (p, emphasized)
              if 'Django' in p.name:
                  assert 'Django Sample v1.3' in joined, p
                  assert 'LAW-DJANGO-001' in joined, p
          print('FSL v1.3 release document verification passed')
          PY

      - name: Create checksums and release pack
        run: |
          set -euo pipefail
          cd release/v1.3
          find . -maxdepth 1 -type f ! -name 'FSL-Pack-v1.3.zip' ! -name 'FSL-Pack-v1.3.zip.sha256' ! -name 'SHA256SUMS.txt' -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
          zip -q -9 FSL-Pack-v1.3.zip $(find . -maxdepth 1 -type f ! -name 'FSL-Pack-v1.3.zip' ! -name 'FSL-Pack-v1.3.zip.sha256' -printf '%f\n' | sort)
          sha256sum FSL-Pack-v1.3.zip > FSL-Pack-v1.3.zip.sha256
          sha256sum -c FSL-Pack-v1.3.zip.sha256

      - name: Write branch release index
        run: |
          cat > release/v1.3/ARTIFACTS.md <<'EOF'
          # FSL v1.3 branch release artifacts

          Canonical branch-scoped FSL v1.3 release snapshot.

          Contains the actual 1P/2P/3P DOCX+PDF templates, Django 2P DOCX+PDF sample, Constitution, Manifest, Traceability Guide, Snapshot example, exact Four-Square release snapshot, Skill, Checklist, Memory, release notes, VERSION, per-file checksums, complete ZIP and ZIP checksum.

          The exact release snapshot records the reviewed SPEC / templates / skill / MEMORY commit IDs and the accepted `main` integration commit. Git remains authoritative.

          Build verification checks exact page counts, visible `Four-Square Template v1.3`, separate `Django Sample v1.3` identity, clause IDs, constitutional vocabulary, normative emphasis, MEMORY authority, and snapshot commit identity.

          Because this repository is public, this branch is publicly readable even though it is branch-scoped rather than a GitHub Releases-page publication.
          EOF

      - name: Commit verified branch release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/v1.3
          if git diff --cached --quiet; then
            echo 'No generated release changes.'
          else
            git commit -m 'release: build verified FSL v1.3 branch artifacts [skip ci]'
            git push origin HEAD:release/fsl-v1.3
          fi
