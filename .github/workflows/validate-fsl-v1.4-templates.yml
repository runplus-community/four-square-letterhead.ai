name: Build and verify FSL v1.4 templates

on:
  push:
    branches: [templates-v1.4]
    paths:
      - 'templates/v1.4/build_templates.py'
      - '.github/workflows/validate-fsl-v1.4-templates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: templates-v1.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils
          python -m pip install --disable-pip-version-check python-docx
      - name: Generate DOCX
        run: python templates/v1.4/build_templates.py
      - name: Render PDFs
        run: |
          mkdir -p /tmp/fsl-v14-pdf
          for f in templates/v1.4/FSL-v1.4-*.docx; do
            libreoffice --headless --convert-to pdf --outdir /tmp/fsl-v14-pdf "$f" >/dev/null
          done
          cp /tmp/fsl-v14-pdf/*.pdf templates/v1.4/
      - name: Validate documents
        run: |
          set -euo pipefail
          test "$(pdfinfo templates/v1.4/FSL-v1.4-Template-1P.pdf | awk '/^Pages:/ {print $2}')" = 1
          test "$(pdfinfo templates/v1.4/FSL-v1.4-Template-2P.pdf | awk '/^Pages:/ {print $2}')" = 2
          test "$(pdfinfo templates/v1.4/FSL-v1.4-Template-3P.pdf | awk '/^Pages:/ {print $2}')" = 3
          test "$(pdfinfo templates/v1.4/FSL-v1.4-Sample-Django-2P.pdf | awk '/^Pages:/ {print $2}')" = 2
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          root=Path('templates/v1.4')
          docs=list(root.glob('FSL-v1.4-*.docx'))
          assert len(docs)==4, docs
          for p in docs:
              d=Document(p)
              text=[]
              for s in d.sections:
                  for tbl in list(s.header.tables)+list(s.footer.tables):
                      for row in tbl.rows:
                          for cell in row.cells: text.append(cell.text)
              for para in d.paragraphs: text.append(para.text)
              for tbl in d.tables:
                  for row in tbl.rows:
                      for cell in row.cells: text.append(cell.text)
              joined='\n'.join(text)
              assert 'Four-Square Template v1.4' in joined, p
              assert 'TOUCH EVERYTHING REQUIRED' in joined, p
              if 'Django' in p.name: assert 'Django Sample v1.4' in joined, p
              if '2P' in p.name or '3P' in p.name:
                  assert 'TOUCHPOINT SET' in joined, p
                  assert 'PARALLEL E2E' in joined, p
                  assert 'TECHNOLOGY / LIBRARY / REFERENCE / LINK' in joined, p
          print('FSL v1.4 template validation passed')
          PY
      - name: Checksums
        run: |
          cd templates/v1.4
          sha256sum FSL-v1.4-Template-*.docx FSL-v1.4-Template-*.pdf FSL-v1.4-Sample-Django-2P.docx FSL-v1.4-Sample-Django-2P.pdf > SHA256SUMS.txt
      - name: Commit verified artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/v1.4
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'templates: build verified FSL v1.4 artifacts [skip ci]'
            git push origin HEAD:templates-v1.4
          fi
