name: Validate FSL v1.6 skill

on:
  push:
    branches: [skill-v1.6]
  workflow_dispatch:

jobs:
  validate-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: skill-v1.6
      - name: Validate generation and lifecycle guidance
        run: |
          set -euo pipefail
          test -f skills/FSL-v1.6-SKILL.md
          test -f skills/FSL-v1.6-CHECKLIST.md
          grep -q 'Four-Square Template v1.6' skills/FSL-v1.6-SKILL.md
          grep -q 'I-001: tiny' skills/FSL-v1.6-SKILL.md
          grep -q 'Draft -> Prove -> Release -> Appendix / Errata / Amendment -> Next Release' skills/FSL-v1.6-SKILL.md
          grep -q 'APPENDIX-A' skills/FSL-v1.6-SKILL.md
          grep -q 'ERRATA-001' skills/FSL-v1.6-SKILL.md
          grep -q 'AMENDMENT-001' skills/FSL-v1.6-SKILL.md
          grep -q 'Release is immutable. Clarify with appendix, correct with errata, change with amendment.' skills/FSL-v1.6-SKILL.md
          grep -q 'FSL owns the method. The project owns the work.' skills/FSL-v1.6-SKILL.md
