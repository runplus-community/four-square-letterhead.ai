name: Validate FSL v1.4 spec

on:
  push:
    branches: [spec-v1.4]
  workflow_dispatch:

jobs:
  validate-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec-v1.4
      - name: Validate v1.4 constitutional additions
        run: |
          set -euo pipefail
          test -f spec/FSL-v1.4-CONSTITUTION.md
          test -f spec/FSL-v1.4-DEVELOPMENT-STRATEGIES.md
          test -f spec/FSL-v1.4-IMPLEMENTATION-REFERENCES.md
          test -f spec/FSL-v1.4-MANIFEST.yaml
          grep -q 'LAW-DEV-001' spec/FSL-v1.4-CONSTITUTION.md
          grep -q 'TOUCHPOINT SET' spec/FSL-v1.4-CONSTITUTION.md
          grep -q 'PARALLEL E2E' spec/FSL-v1.4-CONSTITUTION.md
          grep -q 'MEET-IN-THE-MIDDLE' spec/FSL-v1.4-CONSTITUTION.md
          grep -q 'LAW-REF-001' spec/FSL-v1.4-CONSTITUTION.md
          grep -q 'TECHNOLOGY' spec/FSL-v1.4-IMPLEMENTATION-REFERENCES.md
          grep -q 'TOUCH EVERYTHING REQUIRED' spec/FSL-v1.4-DEVELOPMENT-STRATEGIES.md
          grep -q 'page_depth: \[1, 2, 3\]' spec/FSL-v1.4-MANIFEST.yaml
