name: Validate FSL v1.3 spec

on:
  push:
    branches: [spec-v1.3]
  workflow_dispatch:

jobs:
  validate-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec-v1.3
      - name: Validate constitutional contract
        run: |
          set -euo pipefail
          test -f spec/FSL-v1.3-CONSTITUTION.md
          test -f spec/FSL-v1.3-MANIFEST.yaml
          test -f spec/FSL-v1.3-TRACEABILITY.md
          test -f spec/FSL-v1.3-SNAPSHOT.example.yaml
          grep -q 'LAW-TRACE-001' spec/FSL-v1.3-CONSTITUTION.md
          grep -q 'LAW-VERSION-001' spec/FSL-v1.3-CONSTITUTION.md
          grep -q 'LAW-SNAPSHOT-001' spec/FSL-v1.3-CONSTITUTION.md
          grep -q 'LAW-AI-001' spec/FSL-v1.3-CONSTITUTION.md
          grep -q 'MEMORY may remember law; MEMORY cannot make law' spec/FSL-v1.3-CONSTITUTION.md
          grep -q 'FORM-SCOPE-NNN' spec/FSL-v1.3-MANIFEST.yaml
          grep -q 'CLAIM, SCOPE, ENVIRONMENT, EVIDENCE, RESULT' spec/FSL-v1.3-MANIFEST.yaml
          grep -q 'authority: "git"' spec/FSL-v1.3-SNAPSHOT.example.yaml
