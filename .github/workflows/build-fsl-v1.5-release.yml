name: Build FSL v1.5 branch release

on:
  push:
    branches: [release/fsl-v1.5]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/fsl-v1.5

      - name: Install verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils zip
          python -m pip install --disable-pip-version-check python-docx==1.2.0

      - name: Assemble v1.5 release
        run: |
          set -euo pipefail
          rm -rf release/v1.5
          mkdir -p release/v1.5/source

          cp spec/FSL-v1.5-CONSTITUTION.md release/v1.5/
          cp skills/FSL-v1.5-SKILL.md release/v1.5/
          cp skills/FSL-v1.5-CHECKLIST.md release/v1.5/
          cp memory/FSL-v1.5-MEMORY.md release/v1.5/
          cp templates/v1.5/FSL-v1.5-Template-1P.docx release/v1.5/
          cp templates/v1.5/FSL-v1.5-Template-1P.pdf release/v1.5/
          cp templates/v1.5/FSL-v1.5-Template-2P.docx release/v1.5/
          cp templates/v1.5/FSL-v1.5-Template-2P.pdf release/v1.5/
          cp templates/v1.5/FSL-v1.5-Template-3P.docx release/v1.5/
          cp templates/v1.5/FSL-v1.5-Template-3P.pdf release/v1.5/
          cp templates/v1.5/FSL-v1.5-Sample-Django-2P.docx release/v1.5/
          cp templates/v1.5/FSL-v1.5-Sample-Django-2P.pdf release/v1.5/
          cp templates/v1.5/build_templates.py release/v1.5/source/
          printf 'python-docx==1.2.0\n' > release/v1.5/source/requirements.txt
          cp README.md release/v1.5/README.md
          cp RELEASES/FSL-v1.5.md release/v1.5/FSL-v1.5-CHANGELOG.md
          cp RELEASES/FSL-v1.5-SNAPSHOT.md release/v1.5/FSL-v1.5-SNAPSHOT.md
          cp VERSION release/v1.5/VERSION

          cat > release/v1.5/FSL-v1.5-VALIDATION.md <<'EOF'
          # FSL v1.5 — Release validation

          This branch release was assembled from the reviewed FSL v1.5 Four-Square integration.

          Verified by GitHub Actions:
          - exact PDF page counts: 1 / 2 / 3 / 2
          - visible `Four-Square Template v1.5`
          - ownership footer on every generated document
          - initial `I-001` development sequence
          - project-relative `spec-vN` / `memory-vN` lane labels
          - normative keyword emphasis in DOCX
          - Django sample identity and illustrative clause marker
          - exact reviewed four-commit snapshot present

          Publication scope: public branch-scoped release in this repository. Git remains authoritative.
          EOF

          cat > release/v1.5/source/README.md <<'EOF'
          # Build source

          Generate editable DOCX files with:

          ```sh
          python -m pip install -r source/requirements.txt
          python source/build_templates.py --output .
          ```

          Render PDFs with LibreOffice and verify the exact page counts and footer before publishing. FSL does not require YAML iteration tracking.
          EOF

      - name: Verify release contract
        run: |
          set -euo pipefail
          test "$(pdfinfo release/v1.5/FSL-v1.5-Template-1P.pdf | awk '/^Pages:/ {print $2}')" = 1
          test "$(pdfinfo release/v1.5/FSL-v1.5-Template-2P.pdf | awk '/^Pages:/ {print $2}')" = 2
          test "$(pdfinfo release/v1.5/FSL-v1.5-Template-3P.pdf | awk '/^Pages:/ {print $2}')" = 3
          test "$(pdfinfo release/v1.5/FSL-v1.5-Sample-Django-2P.pdf | awk '/^Pages:/ {print $2}')" = 2
          grep -q 'FSL owns the method. The project owns the work.' release/v1.5/FSL-v1.5-CONSTITUTION.md
          grep -q 'I-001: tiny' release/v1.5/FSL-v1.5-CONSTITUTION.md
          grep -q 'c85b3db3dadf949d9fab1f6640951f506d2aedce' release/v1.5/FSL-v1.5-SNAPSHOT.md
          grep -q '87bc2c6037cc3695ed10728c457300184967eb6c' release/v1.5/FSL-v1.5-SNAPSHOT.md
          grep -q 'a586e516a9c5731c6aef3069cef9601e9af03ea5' release/v1.5/FSL-v1.5-SNAPSHOT.md
          grep -q 'e2269275aeb0a9f21fe8b009649d3f3ccc7bc3c5' release/v1.5/FSL-v1.5-SNAPSHOT.md
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          root=Path('release/v1.5')
          docs=sorted(root.glob('FSL-v1.5-*.docx'))
          assert len(docs)==4, docs
          for p in docs:
              d=Document(p)
              text=[]; emphasized=0
              for s in d.sections:
                  for para in list(s.header.paragraphs)+list(s.footer.paragraphs):
                      text.append(para.text)
                      for r in para.runs:
                          if r.bold and r.underline and any(k in r.text for k in ('MUST','SHOULD','MAY','CONFORMANT','EXCEPTION')):
                              emphasized += 1
              for para in d.paragraphs:
                  text.append(para.text)
                  for r in para.runs:
                      if r.bold and r.underline and any(k in r.text for k in ('MUST','SHOULD','MAY','CONFORMANT','EXCEPTION')):
                          emphasized += 1
              for tbl in d.tables:
                  for row in tbl.rows:
                      for cell in row.cells:
                          text.append(cell.text)
                          for para in cell.paragraphs:
                              for r in para.runs:
                                  if r.bold and r.underline and any(k in r.text for k in ('MUST','SHOULD','MAY','CONFORMANT','EXCEPTION')):
                                      emphasized += 1
              joined='\n'.join(text)
              assert 'Four-Square Template v1.5' in joined, p
              assert 'FSL owns the method. The project owns the work.' in joined, p
              assert 'I-001:' in joined, p
              assert emphasized >= 5, (p, emphasized)
              if 'Django' in p.name:
                  assert 'Sample edition v1.5' in joined, p
                  assert 'LAW-DJANGO-001' in joined, p
          print('FSL v1.5 branch release validation passed')
          PY

      - name: Build manifest, checksums and ZIP
        run: |
          set -euo pipefail
          cd release/v1.5
          find . -type f ! -name 'MANIFEST.txt' ! -name 'SHA256SUMS.txt' ! -name 'FSL-Pack-v1.5.zip' ! -name 'FSL-Pack-v1.5.zip.sha256' -printf '%P\n' | sort > MANIFEST.txt
          while IFS= read -r f; do sha256sum "$f"; done < MANIFEST.txt > SHA256SUMS.txt
          zip -q -9 -r FSL-Pack-v1.5.zip . -x 'FSL-Pack-v1.5.zip' 'FSL-Pack-v1.5.zip.sha256'
          sha256sum FSL-Pack-v1.5.zip > FSL-Pack-v1.5.zip.sha256
          sha256sum -c FSL-Pack-v1.5.zip.sha256

      - name: Write branch release index
        run: |
          cat > release/v1.5/ARTIFACTS.md <<'EOF'
          # FSL v1.5 branch release artifacts

          Canonical branch-scoped FSL v1.5 package.

          Includes the 1P/2P/3P templates, Django 2P sample, Constitution, Skill, Checklist, Memory, release notes, exact Four-Square snapshot, build source, validation report, manifest, checksums and complete ZIP.

          **FSL owns the method. The project owns the work.**
          EOF

      - name: Commit verified branch release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/v1.5
          git commit -m 'release: build verified FSL v1.5 branch artifacts [skip ci]'
          git push origin HEAD:release/fsl-v1.5
