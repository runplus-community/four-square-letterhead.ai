name: Validate FSL v1.6 memory

on:
  push:
    branches: [memory-v1.6]
  workflow_dispatch:

jobs:
  validate-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: memory-v1.6
      - name: Validate lifecycle recall
        run: |
          set -euo pipefail
          test -f memory/FSL-v1.6-MEMORY.md
          grep -q 'Four-Square Template v1.6' memory/FSL-v1.6-MEMORY.md
          grep -q 'Draft -> Prove -> Release -> Appendix / Errata / Amendment -> Next Release' memory/FSL-v1.6-MEMORY.md
          grep -q 'APPENDIX-A' memory/FSL-v1.6-MEMORY.md
          grep -q 'ERRATA-001' memory/FSL-v1.6-MEMORY.md
          grep -q 'AMENDMENT-001' memory/FSL-v1.6-MEMORY.md
          grep -q 'Release is immutable. Clarify with appendix, correct with errata, change with amendment.' memory/FSL-v1.6-MEMORY.md
          grep -q 'MEMORY may remember law; MEMORY cannot make law.' memory/FSL-v1.6-MEMORY.md
          grep -q 'FSL owns the method. The project owns the work.' memory/FSL-v1.6-MEMORY.md
