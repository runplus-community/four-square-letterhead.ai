name: Build FSL v1.1 branch release

on:
  workflow_dispatch:
  push:
    branches:
      - release/fsl-v1.1
    paths:
      - .github/workflows/build-fsl-v1.1.yml
      - tools/build_fsl_v1_1.py
      - release/v1.1/FSL-v1.1-MEMORY.md
      - release/v1.1/FSL-v1.1-SKILL.md
      - release/v1.1/FSL-v1.1-MANIFEST.yaml

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/fsl-v1.1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils fonts-liberation zip

      - name: Build DOCX artifacts
        env:
          FSL_OUT: build/fsl-v1.1
        run: |
          rm -rf build/fsl-v1.1 build/pdf
          mkdir -p build/fsl-v1.1 build/pdf
          python tools/build_fsl_v1_1.py

      - name: Render PDF artifacts
        run: |
          for f in build/fsl-v1.1/*.docx; do
            libreoffice --headless --convert-to pdf --outdir build/pdf "$f"
          done

      - name: Assemble canonical branch release
        run: |
          rm -f release/v1.1/*.docx release/v1.1/*.pdf
          rm -f release/v1.1/FSL-Pack-v1.1.zip release/v1.1/FSL-Pack-v1.1.zip.sha256 release/v1.1/SHA256SUMS.txt release/v1.1/VERSION
          cp build/fsl-v1.1/FSL-v1.1-Template-1P.docx release/v1.1/
          cp build/fsl-v1.1/FSL-v1.1-Template-2P.docx release/v1.1/
          cp build/fsl-v1.1/FSL-v1.1-Template-3P.docx release/v1.1/
          cp build/fsl-v1.1/FSL-v1.1-Sample-Django-2P.docx release/v1.1/
          cp build/pdf/FSL-v1.1-Template-1P.pdf release/v1.1/
          cp build/pdf/FSL-v1.1-Template-2P.pdf release/v1.1/
          cp build/pdf/FSL-v1.1-Template-3P.pdf release/v1.1/
          cp build/pdf/FSL-v1.1-Sample-Django-2P.pdf release/v1.1/
          cp VERSION release/v1.1/VERSION

      - name: Validate document artifacts
        run: |
          set -euo pipefail
          for f in release/v1.1/*.docx; do unzip -tq "$f" >/dev/null; done
          test "$(pdfinfo release/v1.1/FSL-v1.1-Template-1P.pdf | awk '/^Pages:/ {print $2}')" = "1"
          test "$(pdfinfo release/v1.1/FSL-v1.1-Template-2P.pdf | awk '/^Pages:/ {print $2}')" = "2"
          test "$(pdfinfo release/v1.1/FSL-v1.1-Template-3P.pdf | awk '/^Pages:/ {print $2}')" = "3"
          test "$(pdfinfo release/v1.1/FSL-v1.1-Sample-Django-2P.pdf | awk '/^Pages:/ {print $2}')" = "2"
          for f in release/v1.1/*.pdf; do
            pdftotext "$f" - | grep -Fq 'Four-Square Template v1.1'
          done
          pdftotext release/v1.1/FSL-v1.1-Sample-Django-2P.pdf - | grep -Fq 'Django Sample v1.1'
          pdftotext release/v1.1/FSL-v1.1-Sample-Django-2P.pdf - | grep -Fq 'code-v1'
          pdftotext release/v1.1/FSL-v1.1-Sample-Django-2P.pdf - | grep -Fq 'docs-v1'
          grep -Fq 'SPEC' release/v1.1/FSL-v1.1-SKILL.md
          grep -Fq 'MEMORY' release/v1.1/FSL-v1.1-SKILL.md
          grep -Fq 'ai-vN' release/v1.1/FSL-v1.1-SKILL.md
          grep -Fq 'version: "1.1"' release/v1.1/FSL-v1.1-MANIFEST.yaml

      - name: Create checksums and pack
        working-directory: release/v1.1
        run: |
          sha256sum \
            FSL-v1.1-Template-1P.docx FSL-v1.1-Template-1P.pdf \
            FSL-v1.1-Template-2P.docx FSL-v1.1-Template-2P.pdf \
            FSL-v1.1-Template-3P.docx FSL-v1.1-Template-3P.pdf \
            FSL-v1.1-Sample-Django-2P.docx FSL-v1.1-Sample-Django-2P.pdf \
            FSL-v1.1-SKILL.md FSL-v1.1-MEMORY.md FSL-v1.1-MANIFEST.yaml \
            README.md ARTIFACTS.md VERSION > SHA256SUMS.txt
          zip -q FSL-Pack-v1.1.zip \
            FSL-v1.1-Template-1P.docx FSL-v1.1-Template-1P.pdf \
            FSL-v1.1-Template-2P.docx FSL-v1.1-Template-2P.pdf \
            FSL-v1.1-Template-3P.docx FSL-v1.1-Template-3P.pdf \
            FSL-v1.1-Sample-Django-2P.docx FSL-v1.1-Sample-Django-2P.pdf \
            FSL-v1.1-SKILL.md FSL-v1.1-MEMORY.md FSL-v1.1-MANIFEST.yaml \
            README.md ARTIFACTS.md VERSION SHA256SUMS.txt
          sha256sum FSL-Pack-v1.1.zip > FSL-Pack-v1.1.zip.sha256
          unzip -tq FSL-Pack-v1.1.zip >/dev/null

      - name: Commit generated branch-release artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/v1.1
          if git diff --cached --quiet; then
            echo 'Artifacts already current.'
            exit 0
          fi
          git commit -m 'release: build verified FSL v1.1 artifacts [skip ci]'
          git push origin HEAD:release/fsl-v1.1
