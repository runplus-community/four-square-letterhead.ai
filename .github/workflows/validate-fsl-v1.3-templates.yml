name: Build and verify FSL v1.3 templates

on:
  push:
    branches: [templates-v1.3]
    paths:
      - 'templates/v1.3/build_templates.py'
      - '.github/workflows/validate-fsl-v1.3-templates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout templates lane
        uses: actions/checkout@v4
        with:
          ref: templates-v1.3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils
          python -m pip install --disable-pip-version-check python-docx

      - name: Generate DOCX artifacts
        run: python templates/v1.3/build_templates.py

      - name: Render PDF artifacts
        run: |
          mkdir -p /tmp/fsl-v13-pdf
          for f in templates/v1.3/FSL-v1.3-*.docx; do
            libreoffice --headless --convert-to pdf --outdir /tmp/fsl-v13-pdf "$f" >/dev/null
          done
          cp /tmp/fsl-v13-pdf/*.pdf templates/v1.3/

      - name: Validate page counts and identities
        run: |
          set -euo pipefail
          test "$(pdfinfo templates/v1.3/FSL-v1.3-Template-1P.pdf | awk '/^Pages:/ {print $2}')" = 1
          test "$(pdfinfo templates/v1.3/FSL-v1.3-Template-2P.pdf | awk '/^Pages:/ {print $2}')" = 2
          test "$(pdfinfo templates/v1.3/FSL-v1.3-Template-3P.pdf | awk '/^Pages:/ {print $2}')" = 3
          test "$(pdfinfo templates/v1.3/FSL-v1.3-Sample-Django-2P.pdf | awk '/^Pages:/ {print $2}')" = 2
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          root=Path('templates/v1.3')
          docs=list(root.glob('FSL-v1.3-*.docx'))
          assert len(docs)==4, docs
          for p in docs:
              d=Document(p)
              text=[]; emphasized=0
              for s in d.sections:
                  for tbl in list(s.header.tables)+list(s.footer.tables):
                      for row in tbl.rows:
                          for cell in row.cells: text.append(cell.text)
              for para in d.paragraphs:
                  text.append(para.text)
                  for r in para.runs:
                      if r.bold and r.underline and any(k in r.text for k in ('MUST','SHOULD','MAY','CONFORMANT','EXCEPTION')):
                          emphasized += 1
              for tbl in d.tables:
                  for row in tbl.rows:
                      for cell in row.cells:
                          text.append(cell.text)
                          for para in cell.paragraphs:
                              for r in para.runs:
                                  if r.bold and r.underline and any(k in r.text for k in ('MUST','SHOULD','MAY','CONFORMANT','EXCEPTION')):
                                      emphasized += 1
              joined='\n'.join(text)
              assert 'Four-Square Template v1.3' in joined, p
              assert emphasized >= 5, (p, emphasized)
              if 'Django' in p.name:
                  assert 'Django Sample v1.3' in joined, p
                  assert 'LAW-DJANGO-001' in joined, p
              if '3P' in p.name:
                  for token in ('LAW-TRACE-001','LAW-VERSION-001','LAW-SNAPSHOT-001','LAW-AI-001'):
                      assert token in joined, (p,token)
          print('FSL v1.3 template validation passed')
          PY

      - name: Generate checksums
        run: |
          cd templates/v1.3
          sha256sum FSL-v1.3-Template-*.docx FSL-v1.3-Template-*.pdf FSL-v1.3-Sample-Django-2P.docx FSL-v1.3-Sample-Django-2P.pdf > SHA256SUMS.txt

      - name: Commit verified artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/v1.3/FSL-v1.3-*.docx templates/v1.3/FSL-v1.3-*.pdf templates/v1.3/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'templates: build verified FSL v1.3 artifacts [skip ci]'
            git push origin HEAD:templates-v1.3
          fi
