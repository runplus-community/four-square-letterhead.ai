name: Validate FSL v1.3 memory

on:
  push:
    branches: [memory-v1.3]
  workflow_dispatch:

jobs:
  validate-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: memory-v1.3
      - name: Validate file-backed recall contract
        run: |
          set -euo pipefail
          test -f memory/FSL-v1.3-MEMORY.md
          grep -q 'Canonical version: v1.3' memory/FSL-v1.3-MEMORY.md
          grep -q 'actual v1.3 files first' memory/FSL-v1.3-MEMORY.md
          grep -q 'FORM-SCOPE-NNN' memory/FSL-v1.3-MEMORY.md
          grep -q 'CLAIM / SCOPE / ENVIRONMENT / EVIDENCE / RESULT' memory/FSL-v1.3-MEMORY.md
          grep -q 'The snapshot never replaces Git' memory/FSL-v1.3-MEMORY.md
          grep -q 'MEMORY may remember law; MEMORY cannot make law' memory/FSL-v1.3-MEMORY.md
          grep -q 'silently choose the stronger/weaker interpretation' memory/FSL-v1.3-MEMORY.md
