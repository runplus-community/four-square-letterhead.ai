name: Build and verify FSL v1.5 templates

on:
  push:
    branches: [templates-v1.5]
    paths:
      - 'templates/v1.5/source/**'
      - '.github/workflows/build-fsl-v1.5-templates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: templates-v1.5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils
          python -m pip install --disable-pip-version-check python-docx==1.2.0

      - name: Assemble standalone generator
        run: |
          cat templates/v1.5/source/build_templates.part1.py templates/v1.5/source/build_templates.part2.py > templates/v1.5/build_templates.py

      - name: Generate DOCX
        run: python templates/v1.5/build_templates.py --output templates/v1.5

      - name: Render PDFs
        run: |
          mkdir -p /tmp/fsl-v15-pdf
          for f in templates/v1.5/FSL-v1.5-*.docx; do
            libreoffice --headless --convert-to pdf --outdir /tmp/fsl-v15-pdf "$f" >/dev/null
          done
          cp /tmp/fsl-v15-pdf/*.pdf templates/v1.5/

      - name: Validate v1.5 contract
        run: |
          set -euo pipefail
          test "$(pdfinfo templates/v1.5/FSL-v1.5-Template-1P.pdf | awk '/^Pages:/ {print $2}')" = 1
          test "$(pdfinfo templates/v1.5/FSL-v1.5-Template-2P.pdf | awk '/^Pages:/ {print $2}')" = 2
          test "$(pdfinfo templates/v1.5/FSL-v1.5-Template-3P.pdf | awk '/^Pages:/ {print $2}')" = 3
          test "$(pdfinfo templates/v1.5/FSL-v1.5-Sample-Django-2P.pdf | awk '/^Pages:/ {print $2}')" = 2
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          root=Path('templates/v1.5')
          docs=sorted(root.glob('FSL-v1.5-*.docx'))
          assert len(docs)==4, docs
          for p in docs:
              d=Document(p)
              text=[]; emphasized=0
              for s in d.sections:
                  for tbl in list(s.header.tables)+list(s.footer.tables):
                      for row in tbl.rows:
                          for cell in row.cells: text.append(cell.text)
                  for para in list(s.header.paragraphs)+list(s.footer.paragraphs):
                      text.append(para.text)
                      for r in para.runs:
                          if r.bold and r.underline and any(k in r.text for k in ('MUST','SHOULD','MAY','CONFORMANT','EXCEPTION')):
                              emphasized += 1
              for para in d.paragraphs:
                  text.append(para.text)
                  for r in para.runs:
                      if r.bold and r.underline and any(k in r.text for k in ('MUST','SHOULD','MAY','CONFORMANT','EXCEPTION')):
                          emphasized += 1
              for tbl in d.tables:
                  for row in tbl.rows:
                      for cell in row.cells:
                          text.append(cell.text)
                          for para in cell.paragraphs:
                              for r in para.runs:
                                  if r.bold and r.underline and any(k in r.text for k in ('MUST','SHOULD','MAY','CONFORMANT','EXCEPTION')):
                                      emphasized += 1
              joined='\n'.join(text)
              assert 'Four-Square Template v1.5' in joined, p
              assert 'FSL owns the method. The project owns the work.' in joined, p
              assert 'I-001:' in joined, p
              assert 'spec-vN' in joined and 'memory-vN' in joined, p
              assert emphasized >= 5, (p, emphasized)
              if 'Django' in p.name:
                  assert 'Sample edition v1.5' in joined, p
                  assert 'LAW-DJANGO-001' in joined, p
          print('FSL v1.5 document contract passed')
          PY

      - name: Generate checksums
        run: |
          cd templates/v1.5
          sha256sum FSL-v1.5-Template-*.docx FSL-v1.5-Template-*.pdf FSL-v1.5-Sample-Django-2P.docx FSL-v1.5-Sample-Django-2P.pdf > SHA256SUMS.txt

      - name: Commit verified artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm templates/v1.5/source/build_templates.part1.py templates/v1.5/source/build_templates.part2.py
          git add templates/v1.5/build_templates.py templates/v1.5/FSL-v1.5-*.docx templates/v1.5/FSL-v1.5-*.pdf templates/v1.5/SHA256SUMS.txt
          git commit -m 'templates: build verified FSL v1.5 artifacts [skip ci]'
          git push origin HEAD:templates-v1.5
